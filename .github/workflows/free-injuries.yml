name: NBA official injury alerts (free)

on:
  workflow_dispatch:
  schedule:
    # GitHub uses UTC. Scheduled starts are best-effort and may be delayed.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: official-nba-injury-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh repository before checking the report
        shell: bash
        run: |
          set -euo pipefail
          echo 'Workflow version: save-fix-v2'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free monitor dependencies
        run: python -m pip install -q requests beautifulsoup4 pymupdf pandas numpy

      - name: Verify real NBA data readiness (does not block OUT alert)
        continue-on-error: true
        run: python nba_live_audit.py

      - name: Check official injury report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python free_alert_worker.py --once

      - name: Persist state for next scheduled run
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f runtime/official_snapshot.json ]; then
            echo 'No snapshot to save.'
            exit 0
          fi

          git config user.name 'nba-injury-monitor[bot]'
          git config user.email 'nba-injury-monitor[bot]@users.noreply.github.com'
          git add -f runtime/official_snapshot.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged; no push needed.'
            exit 0
          fi

          git commit -m 'Update official NBA injury watch snapshot [skip ci]'

          # Bring in other commits without overwriting remote changes.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent edit conflict; refusing to overwrite remote snapshot.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Snapshot saved.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not save state after 3 attempts.'
          exit 1
