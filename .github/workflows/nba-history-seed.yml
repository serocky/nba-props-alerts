name: NBA - pobierz historie 2025-26
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-historical-data-update
  cancel-in-progress: false
jobs:
  import-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: python -m pip install -q pandas pyarrow requests
      - name: Fetch real historical NBA player box scores
        run: python sync_nba_history.py --season-end 2026
      - name: Commit historical CSV dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nba-history-bot'
          git config user.email 'nba-history-bot@users.noreply.github.com'
          git add -f data/real_player_games.csv data/real_schedule.csv
          if git diff --cached --quiet; then
            echo 'History unchanged.'
            exit 0
          fi
          git commit -m 'Update historical NBA stats [skip ci]'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then
              echo 'Saved NBA history.'
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1
