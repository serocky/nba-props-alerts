name: NBA - aktualizacja statystyk 2026-27
on:
  workflow_dispatch:
  schedule:
    # Once daily, source updates approx. 07:00 UTC; Github can delay/skip schedules.
    - cron: '17 9 * * *'
permissions:
  contents: write
concurrency:
  group: nba-season-2027-update
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data libraries
        run: python -m pip install -q pandas pyarrow requests
      - name: Import 2026-27 without deleting 2025-26
        run: python sync_current_season.py
      - name: Persist only real updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nba-history-bot'
          git config user.email 'nba-history-bot@users.noreply.github.com'
          git add -f data/real_player_games.csv data/real_schedule.csv
          if [ -f data/current_roster_observed.csv ]; then
            git add -f data/current_roster_observed.csv
          fi
          if [ -f data/current_season_status.json ]; then
            git add -f data/current_season_status.json
          fi
          if git diff --cached --quiet; then
            echo 'No new complete NBA games; no commit necessary.'
            exit 0
          fi
          git commit -m 'Update 2026-27 NBA boxscores [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'NBA season 2026/27 data saved successfully.'
              exit 0
            fi
            echo "Push attempt ${attempt}/3 failed; retrying..."
            sleep $((attempt*2))
          done
          exit 1
