name: NBA - sprawdz prawdziwe dane live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pobierz najnowszy kod
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instaluj biblioteki
        run: python -m pip install -q pandas numpy requests beautifulsoup4 pymupdf
      - name: Skontroluj realna baze i sklady (bez testowych zdarzen)
        run: python nba_live_audit.py
