name: NBA TEST - zmiana statusu OUT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-out:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj wymagane biblioteki
        run: python -m pip install -q requests beautifulsoup4 pymupdf

      - name: Zasymuluj zmiane QUESTIONABLE na OUT i wyslij test na Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from free_alert_worker import process_report, send_telegram

          # Only synthetic data; the official NBA report and runtime files
          # are NOT changed by this test.
          base = {
              "game_date": "2099-01-01",
              "matchup": "DEM@TST",
              "team": "Fikcyjna Druzyna Testowa",
              "player": "Fikcyjny Zawodnik Testowy",
              "reason": "Symulacja - brak rzeczywistej kontuzji",
              "source_url": "https://example.com/TEST-ONLY",
          }
          state, previous_events = process_report(
              {}, [{**base, "status": "QUESTIONABLE"}], {"state": "test"}
          )
          assert not previous_events, "Pierwszy odczyt nie powinien generowac alertu"

          state, new_events = process_report(
              state, [{**base, "status": "OUT"}], {"state": "test"}
          )
          assert len(new_events) == 1, "Nie wykryto symulowanej zmiany statusu"
          assert new_events[0]["previous"] == "QUESTIONABLE"

          message = (
              "🧪 TEST NBA PROPS LAB — TO NIE JEST PRAWDZIWA ABSENCJA!\n\n"
              "🏀 Fikcyjny mecz DEM@TST\n"
              "👤 Fikcyjny Zawodnik Testowy\n"
              "🔁 QUESTIONABLE → OUT\n\n"
              "✅ Program wykryl zmiane statusu i wyslal powiadomienie.\n"
              "⚠️ To jedynie test techniczny. Nie obstawiaj na tej podstawie."
          )
          if not send_telegram(message):
              raise SystemExit("Nie wyslano testu. Sprawdz GitHub Secrets i Telegram.")
          print("OK: TESTOWY alert o zmianie statusu zostal wyslany na Telegram.")
          print("Rzeczywisty raport NBA i snapshot nie byly modyfikowane.")
          PY
